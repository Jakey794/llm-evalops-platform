[project]
name = "llm-evalops-backend"
version = "0.1.0"
description = "FastAPI backend for the LLM Reliability + EvalOps Platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115.0",
    "google-genai>=1.33,<2",
    "openai>=2.11,<3",
    "pydantic-settings>=2.4.0",
    "psycopg[binary]>=3.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg2-binary>=2.9.12",
]

[project.optional-dependencies]
dev = [
    "httpx2>=1.0.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
